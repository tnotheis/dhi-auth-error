name: Test

on:
    workflow_dispatch:

jobs:
    image-test-builds:
        name: Attempt #${{matrix.index}}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - index: 1
                    - index: 2
                    - index: 3
                    - index: 4
                    - index: 5
                    - index: 6
                    - index: 7
                    - index: 8
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Login to DHI.io
              uses: docker/login-action@v3
              with:
                  registry: dhi.io
                  username: ${{ secrets.DHI_DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DHI_DOCKERHUB_TOKEN }}

            - run: docker pull dhi.io/aspnetcore:10.0.1-alpine3.22@sha256:467fbea286437c7345fd5612dbb975e8debae801ab5d93398b5db69fa163d4d8
